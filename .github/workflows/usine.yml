# Usine à données : chaque jour, transforme le GTFS d'Île-de-France Mobilités en catalogue + paquets
# de lignes, et les publie sur GitHub Pages (https://<compte>.github.io/<dépôt>/catalog.json.gz).
# Les applis comparent les versions et ne téléchargent que les lignes modifiées.
name: Usine à données

on:
  schedule:
    # 06:53 UTC, après la publication quotidienne d'IDFM (vers 06:25 UTC). Minute « impaire » : GitHub
    # retarde beaucoup les tâches planifiées à l'heure pile ou à la demie (jusqu'à 7 h constatées).
    - cron: "53 6 * * *"
  workflow_dispatch: # lancement manuel depuis l'onglet Actions
  push: # code de l'usine modifié : on republie sans attendre le lendemain
    branches: [main]
    paths:
      - "usine/**"
      - ".github/workflows/usine.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r usine/requirements.txt
      # publication de la veille : une ligne dont les horaires n'ont pas changé garde son paquet et
      # sa version, et les applis ne la retéléchargent pas
      - uses: actions/cache/restore@v6
        with:
          path: usine/out/public
          key: publication-${{ github.run_id }}
          restore-keys: publication-
      # cache perdu (inutilisé 7 jours, purge) : on repart de la publication en ligne
      - run: python usine/restore_publication.py
      # machine neuve à chaque fois : on reconstruit la base (~4 min)
      - run: python usine/update.py --force
      - name: Contrôle de deux paquets
        run: python usine/check_package.py C01527 C01528
      - uses: actions/cache/save@v6
        with:
          path: usine/out/public
          key: publication-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: usine/out/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # GitHub Pages renvoie parfois une erreur 500 passagère (30/10/2026) : nouvel essai une minute après
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
